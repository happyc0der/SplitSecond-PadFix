; Split/Second PadFix - settings (put this file next to dinput8.dll in the game folder; every key is optional)
[PadFix]
; 1 = build the controller's DirectInput reading from XInput in the wired Xbox 360 layout (needed for Bluetooth).
; 0 = pass the controller through untouched (for comparing with the unmodified game).
Translate=1
; 1 = introduce the controller to the game as a wired Xbox 360 pad (045E:028E). The game only gives that model
;     its Xbox default controls; any other controller gets none. 0 = report the controller's real identity.
PretendWired360=1
; 1 = swap the triggers on the shared Z axis, if accelerate and brake come out reversed.
SwapTriggers=0
; 1 = log the game's controller calls and the first 60 input changes to padfix.log.
Verbose=1
